<!DOCTYPE html>
<html>
    <head>
    <title>Forms</title>
    <meta charset="UTF-8">
    <script>
        function validateForm() {
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirm password").value;
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return false;
            }
            return true;
        }
    </script>
    </head>
    <body> 

    <h1 align = "center">Employee Registration Form</h1>
    <hr>
    <form action="/submit" method="post" align = "center" onsubmit="return(validateForm());">
        <label for="first_name" >First Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter First Name"><br><br>
        <label for="last_name" >Last Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Last Name"><br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>
        <label for="qualification">Qualifications</label>
        <div>
            <input type="checkbox" id="high-school" name="qualification" value="high-school">
            <label for="high-school">High School</label>
            <input type="checkbox" id="bachelors" name="qualification" value="bachelors">
            <label for="bachelors">Bachelor's Degree</label>
            <input type="checkbox" id="masters" name="qualification" value="masters">
            <label for="masters">Master's Degree</label>
            <input type="checkbox" id="phd" name="qualification" value="phd">
            <label for="phd">PhD / Doctorate</label>
        </div><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter Email"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Password"><br><br>
        <label for="confirm password">Confirm Password:</label>
        <input type="password" id="confirm password" name="confirm password" placeholder="Confirm Password"><br><br>
        <label for="Address">Address:</label>
        <input type="text" id="Address" name="Address" size="40" placeholder="Enter Address here"><br><br>   
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    </body>
</html>
